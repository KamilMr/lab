apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-httpd
  name: my-httpd
spec:
  replicas: 10
  selector:
    matchLabels:
      app: my-httpd
  template:
    metadata:
      labels:
        app: my-httpd
    spec:
      containers:
        - image: httpd:alpine3.18
          name: httpd
  strategy:
    type: Recreate
