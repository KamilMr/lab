apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx-yaml
    method: fromcode
    another: label
  name: nginx-storage
spec:
  containers:
  - image: nginx
    name: nginx
    volumeMounts:
      - mountPath: /scratch
        name: scratch-volume
  - image: busybox
    name: busybox
    command: ["/bin/sh", "-c"]
    args: ["sleep 1000"]
    volumeMounts:
      - mountPath: /scratch
        name: scratch-volume

  volumes: # level of pod, we need it to mount
    - name: scratch-volume
      persistentVolumeClaim:
        claimName: mealie-data # this has to point
